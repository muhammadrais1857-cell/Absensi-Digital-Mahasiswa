<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Digital Mahasiswa</title>
<style>
  :root{
    --ink:#1B2340;
    --ink-soft:#4A5170;
    --paper:#EEF0F2;
    --card:#FFFFFF;
    --line:#D8DCE2;
    --gold:#B6862C;
    --gold-soft:#F1E4C8;
    --present:#3E7A56;
    --present-soft:#DEEFE4;
    --sick:#C98A2C;
    --sick-soft:#F6E7CF;
    --permit:#3B6EA5;
    --permit-soft:#DEE9F5;
    --absent:#B5473F;
    --absent-soft:#F6DEDC;
    --radius:10px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:ui-serif, Georgia, 'Times New Roman', serif;
    font-weight:600;
    margin:0;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:13.5px;
    font-weight:600;
    transition:transform .08s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  button.primary{background:var(--ink);color:#fff;}
  button.primary:hover{opacity:.88;}
  button.gold{background:var(--gold);color:#fff;}
  button.gold:hover{opacity:.88;}
  button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  button.ghost:hover{background:#fff;}
  button.danger-ghost{background:transparent;color:var(--absent);border:1px solid var(--absent-soft);}
  button.danger-ghost:hover{background:var(--absent-soft);}
  input,select{
    font-family:inherit;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  input:focus,select:focus,button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }

  header.topbar{
    background:var(--ink);
    color:#F5F3ED;
    padding:18px 24px;
    padding-top:calc(18px + env(safe-area-inset-top,0px));
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header.topbar .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  header.topbar h1{font-size:21px;color:#fff;letter-spacing:.2px;}
  header.topbar .tagline{font-size:12.5px;color:#B9BFD4;}
  .class-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .class-controls select{min-width:160px;}

  main{
    max-width:1200px;
    margin:0 auto;
    padding:22px 20px 60px;
    display:grid;
    grid-template-columns:260px 1fr;
    gap:20px;
  }
  @media (max-width:820px){
    main{grid-template-columns:1fr;}
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .card h2{font-size:15.5px;margin-bottom:12px;}
  .card h2 .count{font-family:'Inter',sans-serif;font-weight:500;color:var(--ink-soft);font-size:12.5px;}

  .roster-form{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .roster-form .row{display:flex;gap:6px;}
  .roster-form input{flex:1;min-width:0;}

  ul.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto;}
  ul.roster li{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;gap:8px;
  }
  ul.roster li .who{display:flex;flex-direction:column;min-width:0;}
  ul.roster li .who .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  ul.roster li .who .nim{color:var(--ink-soft);font-size:11.5px;}
  ul.roster li .remove{
    background:transparent;border:none;color:var(--ink-soft);font-size:16px;line-height:1;
    padding:2px 6px;border-radius:6px;
  }
  ul.roster li .remove:hover{background:var(--absent-soft);color:var(--absent);}

  .empty-hint{
    font-size:13px;color:var(--ink-soft);
    border:1px dashed var(--line);border-radius:8px;
    padding:14px;text-align:center;
  }

  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:10px;margin-bottom:16px;
  }
  .toolbar .left{display:flex;flex-direction:column;gap:2px;}
  .toolbar .left h2{font-size:18px;}
  .toolbar .left .sub{font-size:12.5px;color:var(--ink-soft);}
  .toolbar .actions{display:flex;gap:8px;flex-wrap:wrap;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--ink-soft);}
  .legend .dot{display:inline-flex;align-items:center;gap:5px;}
  .legend .swatch{width:11px;height:11px;border-radius:3px;display:inline-block;}

  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  table.ledger{border-collapse:collapse;width:100%;font-size:13px;min-width:560px;}
  table.ledger th, table.ledger td{
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:9px 10px;
    text-align:center;
    white-space:nowrap;
  }
  table.ledger th:last-child, table.ledger td:last-child{border-right:none;}
  table.ledger thead th{
    background:var(--gold-soft);
    color:var(--ink);
    font-weight:600;
    position:sticky;top:0;
    font-family:ui-serif,Georgia,serif;
  }
  table.ledger thead th.session-head{cursor:default;}
  table.ledger thead th .del-session{
    display:block;margin-top:3px;font-size:10.5px;color:var(--ink-soft);
    background:none;border:none;padding:1px 4px;border-radius:5px;font-weight:500;
  }
  table.ledger thead th .del-session:hover{background:var(--absent-soft);color:var(--absent);}
  table.ledger td.name-col, table.ledger th.name-col{
    text-align:left;position:sticky;left:0;background:#fff;font-weight:600;min-width:170px;
  }
  table.ledger thead th.name-col{background:var(--gold-soft);z-index:2;}
  table.ledger td.nim-col, table.ledger th.nim-col{
    text-align:left;color:var(--ink-soft);font-weight:500;min-width:90px;
  }
  table.ledger td.status-cell{
    cursor:pointer;user-select:none;font-weight:700;min-width:56px;
  }
  table.ledger td.status-cell:hover{filter:brightness(0.97);}
  td.status-cell.st-H{background:var(--present-soft);color:var(--present);}
  td.status-cell.st-S{background:var(--sick-soft);color:var(--sick);}
  td.status-cell.st-I{background:var(--permit-soft);color:var(--permit);}
  td.status-cell.st-A{background:var(--absent-soft);color:var(--absent);}
  table.ledger td.recap-col{font-size:11.5px;color:var(--ink-soft);text-align:left;min-width:120px;}
  table.ledger td.recap-col b{color:var(--ink);}

  footer{
    text-align:center;font-size:11.5px;color:var(--ink-soft);
    padding:20px;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Absensi Digital</h1>
    <span class="tagline">Presensi mahasiswa per pertemuan</span>
  </div>
  <div class="class-controls">
    <select id="classSelect" aria-label="Pilih kelas"></select>
    <button class="ghost" id="renameClassBtn" title="Ganti nama kelas">Ganti nama</button>
    <button class="gold" id="newClassBtn">+ Kelas baru</button>
    <button class="danger-ghost" id="deleteClassBtn">Hapus kelas</button>
  </div>
</header>

<main>
  <section class="card" id="rosterCard">
    <h2>Daftar Mahasiswa <span class="count" id="studentCount"></span></h2>
    <form class="roster-form" id="studentForm">
      <div class="row">
        <input type="text" id="studentName" placeholder="Nama mahasiswa" required>
      </div>
      <div class="row">
        <input type="text" id="studentNim" placeholder="NIM (opsional)">
        <button class="primary" type="submit">Tambah</button>
      </div>
    </form>
    <ul class="roster" id="rosterList"></ul>
  </section>

  <section>
    <div class="toolbar">
      <div class="left">
        <h2 id="className">Kelas</h2>
        <div class="sub" id="classSub">0 mahasiswa &middot; 0 pertemuan</div>
      </div>
      <div class="actions">
        <button class="gold" id="addSessionBtn">+ Pertemuan hari ini</button>
        <button class="ghost" id="exportBtn">Ekspor CSV</button>
        <button class="danger-ghost" id="resetBtn">Reset data</button>
      </div>
    </div>

    <div class="legend">
      <span class="dot"><span class="swatch" style="background:var(--present-soft);border:1px solid var(--present)"></span>H &mdash; Hadir</span>
      <span class="dot"><span class="swatch" style="background:var(--sick-soft);border:1px solid var(--sick)"></span>S &mdash; Sakit</span>
      <span class="dot"><span class="swatch" style="background:var(--permit-soft);border:1px solid var(--permit)"></span>I &mdash; Izin</span>
      <span class="dot"><span class="swatch" style="background:var(--absent-soft);border:1px solid var(--absent)"></span>A &mdash; Alpa</span>
      <span style="color:var(--ink-soft)">Klik sel untuk mengganti status</span>
    </div>

    <div id="ledgerWrap"></div>
  </section>
</main>

<footer>Data tersimpan otomatis di peramban ini (localStorage). Ekspor CSV secara berkala untuk cadangan.</footer>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "absensi-digital-v1";
  var STATUS_CYCLE = ["", "H", "S", "I", "A"];
  var STATUS_LABEL = { H:"Hadir", S:"Sakit", I:"Izin", A:"Alpa" };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ return JSON.parse(raw); }
    }catch(e){ console.error("Gagal membaca data tersimpan:", e); }
    var firstId = uid();
    return {
      activeClassId: firstId,
      classes: {}
    };
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error("Gagal menyimpan data:", e);
      alert("Data gagal disimpan di peramban ini. Coba ekspor CSV secara manual.");
    }
  }

  var state = loadState();

  function ensureAtLeastOneClass(){
    var ids = Object.keys(state.classes);
    if(ids.length === 0){
      var id = state.activeClassId || uid();
      state.classes[id] = { name:"Kelas 1", students:[], sessions:[], attendance:{} };
      state.activeClassId = id;
    }
    if(!state.classes[state.activeClassId]){
      state.activeClassId = Object.keys(state.classes)[0];
    }
  }
  ensureAtLeastOneClass();

  function activeClass(){ return state.classes[state.activeClassId]; }
  function todayLabel(){
    var d = new Date();
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    return dd + "/" + mm + "/" + d.getFullYear();
  }

  // ---- DOM refs ----
  var classSelect = document.getElementById("classSelect");
  var renameClassBtn = document.getElementById("renameClassBtn");
  var newClassBtn = document.getElementById("newClassBtn");
  var deleteClassBtn = document.getElementById("deleteClassBtn");

  var studentForm = document.getElementById("studentForm");
  var studentName = document.getElementById("studentName");
  var studentNim = document.getElementById("studentNim");
  var rosterList = document.getElementById("rosterList");
  var studentCount = document.getElementById("studentCount");

  var classNameEl = document.getElementById("className");
  var classSubEl = document.getElementById("classSub");
  var addSessionBtn = document.getElementById("addSessionBtn");
  var exportBtn = document.getElementById("exportBtn");
  var resetBtn = document.getElementById("resetBtn");
  var ledgerWrap = document.getElementById("ledgerWrap");

  // ---- render ----
  function renderClassSelect(){
    classSelect.innerHTML = "";
    Object.keys(state.classes).forEach(function(id){
      var opt = document.createElement("option");
      opt.value = id;
      opt.textContent = state.classes[id].name;
      if(id === state.activeClassId){ opt.selected = true; }
      classSelect.appendChild(opt);
    });
  }

  function renderRoster(){
    var cls = activeClass();
    rosterList.innerHTML = "";
    studentCount.textContent = "(" + cls.students.length + ")";
    if(cls.students.length === 0){
      var hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Belum ada mahasiswa. Tambahkan lewat form di atas.";
      rosterList.appendChild(hint);
      return;
    }
    cls.students.forEach(function(s){
      var li = document.createElement("li");
      var who = document.createElement("div");
      who.className = "who";
      var nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = s.name;
      who.appendChild(nameEl);
      if(s.nim){
        var nimEl = document.createElement("span");
        nimEl.className = "nim";
        nimEl.textContent = s.nim;
        who.appendChild(nimEl);
      }
      li.appendChild(who);
      var rm = document.createElement("button");
      rm.className = "remove";
      rm.title = "Hapus mahasiswa";
      rm.textContent = "\u00d7";
      rm.addEventListener("click", function(){
        if(confirm("Hapus " + s.name + " dari daftar? Riwayat absensinya juga akan terhapus.")){
          cls.students = cls.students.filter(function(x){ return x.id !== s.id; });
          delete cls.attendance[s.id];
          saveState();
          renderAll();
        }
      });
      li.appendChild(rm);
      rosterList.appendChild(li);
    });
  }

  function recapFor(cls, studentId){
    var counts = { H:0, S:0, I:0, A:0 };
    var rec = cls.attendance[studentId] || {};
    cls.sessions.forEach(function(sess){
      var v = rec[sess.id];
      if(v && counts.hasOwnProperty(v)){ counts[v]++; }
    });
    return counts;
  }

  function renderLedger(){
    var cls = activeClass();
    classNameEl.textContent = cls.name;
    classSubEl.textContent = cls.students.length + " mahasiswa \u00b7 " + cls.sessions.length + " pertemuan";

    ledgerWrap.innerHTML = "";

    if(cls.students.length === 0){
      var h1 = document.createElement("div");
      h1.className = "empty-hint";
      h1.textContent = "Tambahkan mahasiswa terlebih dahulu untuk mulai mencatat absensi.";
      ledgerWrap.appendChild(h1);
      return;
    }
    if(cls.sessions.length === 0){
      var h2 = document.createElement("div");
      h2.className = "empty-hint";
      h2.textContent = "Belum ada pertemuan. Klik \u201c+ Pertemuan hari ini\u201d untuk membuka sesi absensi.";
      ledgerWrap.appendChild(h2);
      return;
    }

    var scrollDiv = document.createElement("div");
    scrollDiv.className = "table-scroll";
    var table = document.createElement("table");
    table.className = "ledger";

    var thead = document.createElement("thead");
    var trh = document.createElement("tr");
    var thName = document.createElement("th");
    thName.className = "name-col";
    thName.textContent = "Nama";
    trh.appendChild(thName);
    var thNim = document.createElement("th");
    thNim.className = "nim-col";
    thNim.textContent = "NIM";
    trh.appendChild(thNim);

    cls.sessions.forEach(function(sess){
      var th = document.createElement("th");
      th.className = "session-head";
      th.textContent = sess.label;
      var del = document.createElement("button");
      del.className = "del-session";
      del.textContent = "hapus";
      del.title = "Hapus pertemuan ini";
      del.addEventListener("click", function(ev){
        ev.stopPropagation();
        if(confirm("Hapus pertemuan \u201c" + sess.label + "\u201d beserta data absensinya?")){
          cls.sessions = cls.sessions.filter(function(x){ return x.id !== sess.id; });
          Object.keys(cls.attendance).forEach(function(sid){
            delete cls.attendance[sid][sess.id];
          });
          saveState();
          renderAll();
        }
      });
      th.appendChild(del);
      trh.appendChild(th);
    });

    var thRecap = document.createElement("th");
    thRecap.textContent = "Rekap";
    trh.appendChild(thRecap);
    thead.appendChild(trh);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    cls.students.forEach(function(s){
      var tr = document.createElement("tr");
      var tdName = document.createElement("td");
      tdName.className = "name-col";
      tdName.textContent = s.name;
      tr.appendChild(tdName);
      var tdNim = document.createElement("td");
      tdNim.className = "nim-col";
      tdNim.textContent = s.nim || "\u2013";
      tr.appendChild(tdNim);

      cls.sessions.forEach(function(sess){
        var td = document.createElement("td");
        var rec = cls.attendance[s.id] || (cls.attendance[s.id] = {});
        var val = rec[sess.id] || "";
        td.className = "status-cell" + (val ? " st-" + val : "");
        td.textContent = val || "\u2014";
        td.title = "Klik untuk ubah status";
        td.addEventListener("click", function(){
          var idx = STATUS_CYCLE.indexOf(rec[sess.id] || "");
          var next = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
          if(next){ rec[sess.id] = next; } else { delete rec[sess.id]; }
          saveState();
          renderLedger();
        });
        tr.appendChild(td);
      });

      var tdRecap = document.createElement("td");
      tdRecap.className = "recap-col";
      var c = recapFor(cls, s.id);
      tdRecap.innerHTML = "<b>H</b> " + c.H + " &middot; <b>S</b> " + c.S + " &middot; <b>I</b> " + c.I + " &middot; <b>A</b> " + c.A;
      tr.appendChild(tdRecap);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scrollDiv.appendChild(table);
    ledgerWrap.appendChild(scrollDiv);
  }

  function renderAll(){
    renderClassSelect();
    renderRoster();
    renderLedger();
  }

  // ---- events: class management ----
  classSelect.addEventListener("change", function(){
    state.activeClassId = classSelect.value;
    saveState();
    renderAll();
  });

  newClassBtn.addEventListener("click", function(){
    var name = prompt("Nama kelas baru:", "Kelas " + (Object.keys(state.classes).length + 1));
    if(!name) return;
    var id = uid();
    state.classes[id] = { name:name.trim(), students:[], sessions:[], attendance:{} };
    state.activeClassId = id;
    saveState();
    renderAll();
  });

  renameClassBtn.addEventListener("click", function(){
    var cls = activeClass();
    var name = prompt("Ganti nama kelas:", cls.name);
    if(!name) return;
    cls.name = name.trim();
    saveState();
    renderAll();
  });

  deleteClassBtn.addEventListener("click", function(){
    var ids = Object.keys(state.classes);
    if(ids.length <= 1){
      alert("Tidak bisa menghapus satu-satunya kelas yang ada.");
      return;
    }
    var cls = activeClass();
    if(confirm("Hapus kelas \u201c" + cls.name + "\u201d beserta seluruh datanya? Tindakan ini tidak bisa dibatalkan.")){
      delete state.classes[state.activeClassId];
      state.activeClassId = Object.keys(state.classes)[0];
      saveState();
      renderAll();
    }
  });

  // ---- events: students ----
  studentForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var name = studentName.value.trim();
    if(!name) return;
    var nim = studentNim.value.trim();
    activeClass().students.push({ id: uid(), name: name, nim: nim });
    studentName.value = "";
    studentNim.value = "";
    saveState();
    renderAll();
    studentName.focus();
  });

  // ---- events: sessions ----
  addSessionBtn.addEventListener("click", function(){
    var cls = activeClass();
    var suggested = "Pertemuan " + (cls.sessions.length + 1) + " (" + todayLabel() + ")";
    var label = prompt("Nama pertemuan:", suggested);
    if(!label) return;
    cls.sessions.push({ id: uid(), label: label.trim(), date: todayLabel() });
    saveState();
    renderAll();
  });

  // ---- export CSV ----
  function csvEscape(v){
    v = String(v == null ? "" : v);
    if(/[",\n]/.test(v)){ v = '"' + v.replace(/"/g,'""') + '"'; }
    return v;
  }

  exportBtn.addEventListener("click", function(){
    var cls = activeClass();
    if(cls.students.length === 0){
      alert("Belum ada data mahasiswa untuk diekspor.");
      return;
    }
    var header = ["Nama","NIM"].concat(cls.sessions.map(function(s){ return s.label; })).concat(["Hadir","Sakit","Izin","Alpa"]);
    var rows = [header];
    cls.students.forEach(function(s){
      var rec = cls.attendance[s.id] || {};
      var row = [s.name, s.nim || ""];
      cls.sessions.forEach(function(sess){ row.push(rec[sess.id] || ""); });
      var c = recapFor(cls, s.id);
      row.push(c.H, c.S, c.I, c.A);
      rows.push(row);
    });
    var csv = rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\n");
    var blob = new Blob(["\uFEFF" + csv], { type:"text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "absensi-" + cls.name.replace(/[^a-z0-9]+/gi,"-").toLowerCase() + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ---- reset ----
  resetBtn.addEventListener("click", function(){
    var cls = activeClass();
    if(confirm("Hapus seluruh data mahasiswa dan pertemuan pada kelas \u201c" + cls.name + "\u201d?")){
      cls.students = [];
      cls.sessions = [];
      cls.attendance = {};
      saveState();
      renderAll();
    }
  });

  renderAll();
})();
</script>
</body>
</html>
